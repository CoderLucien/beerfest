<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>国际啤酒节</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:linear-gradient(180deg,#0a1628 0%,#132a42 50%,#0d3b1e 100%);min-height:100vh;color:#e8e8e8;-webkit-tap-highlight-color:transparent}
.page{max-width:480px;margin:0 auto;padding:16px}

/* Header */
.header{text-align:center;padding:20px 0 16px}
.header .logo{font-size:3em;margin-bottom:2px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.header h1{font-size:1.3em;color:#f5c842;margin-bottom:4px}
.header .sub{font-size:0.82em;color:#8ec8d8}
.header .date{font-size:0.72em;color:#667788;margin-top:2px}

/* Activity */
.act-bar{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.act-bar select{flex:1;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:8px 10px;color:#e8e8e8;font-size:0.85em;outline:none}
.act-bar select:focus{border-color:#f5c842}
.act-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex-shrink:0}

/* Promotion cards */
.section-label{font-size:0.82em;color:#8ec8d8;margin:16px 0 10px;font-weight:600}
.promo-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;transition:all 0.2s}
.promo-card:hover{border-color:rgba(245,200,66,0.25)}
.promo-card.claimed{opacity:0.5;border-color:rgba(74,222,128,0.2)}
.promo-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2em;font-weight:700;flex-shrink:0}
.promo-icon.gold{background:rgba(245,200,66,0.15);color:#f5c842}
.promo-icon.green{background:rgba(74,222,128,0.15);color:#4ade80}
.promo-icon.blue{background:rgba(96,165,250,0.15);color:#60a5fa}
.promo-info{flex:1;min-width:0}
.promo-name{font-weight:600;font-size:0.9em;color:#f0f0f0}
.promo-desc{font-size:0.75em;color:#8899aa;margin-top:2px}
.promo-limit{font-size:0.7em;color:#667788;margin-top:2px}
.btn-claim{padding:8px 16px;border-radius:8px;font-size:0.8em;font-weight:600;cursor:pointer;border:1px solid rgba(245,200,66,0.4);background:rgba(245,200,66,0.12);color:#f5c842;white-space:nowrap;flex-shrink:0;transition:all 0.2s}
.btn-claim:active{transform:scale(0.95)}
.btn-claim.got{border-color:rgba(74,222,128,0.3);background:rgba(74,222,128,0.1);color:#4ade80;cursor:default}
.btn-claim:disabled{opacity:0.4;cursor:not-allowed}
.spinner-inline{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Menu section */
.menu-section{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px;margin:16px 0}
.menu-section h3{color:#f5c842;font-size:0.95em;margin-bottom:12px}
.menu-cats{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
.menu-cat{padding:5px 12px;border-radius:16px;font-size:0.78em;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#8899aa;white-space:nowrap;flex-shrink:0;transition:all 0.2s}
.menu-cat.active{border-color:#f5c842;background:rgba(245,200,66,0.1);color:#f5c842}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.menu-item{background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px;cursor:pointer;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.menu-item:active{transform:scale(0.96)}
.menu-item .mi-name{font-size:0.82em;font-weight:600;color:#e8e8e8}
.menu-item .mi-desc{font-size:0.7em;color:#667788;margin-top:2px}
.menu-item .mi-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.menu-item .mi-price{font-size:0.88em;font-weight:700;color:#f5c842}
.menu-item .mi-add{width:26px;height:26px;border-radius:50%;background:rgba(245,200,66,0.15);border:1px solid rgba(245,200,66,0.3);color:#f5c842;font-size:1em;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0}
.menu-item .mi-add.in-cart{background:rgba(74,222,128,0.2);border-color:rgba(74,222,128,0.3);color:#4ade80}
.cart-panel{background:rgba(0,0,0,0.25);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:none}
.cart-panel.show{display:block}
.cart-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.8em}
.cart-item:last-child{border-bottom:none}
.cart-item .ci-name{flex:1;color:#e0e0e0;min-width:0}
.cart-item .ci-qty{display:flex;align-items:center;gap:6px;margin:0 10px}
.cart-item .ci-qty button{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#8899aa;font-size:0.8em;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cart-item .ci-price{color:#f5c842;font-weight:600;min-width:48px;text-align:right}
.cart-total{display:flex;justify-content:space-between;padding-top:8px;margin-top:4px;border-top:1px solid rgba(255,255,255,0.08);font-size:0.85em;font-weight:700}
.cart-total .ct-label{color:#8ec8d8}
.cart-total .ct-amount{color:#f5c842}
.cart-empty{color:#556677;font-size:0.78em;text-align:center;padding:8px}

/* Checkout section */
.checkout{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px;margin:20px 0}
.checkout h3{color:#f5c842;font-size:0.95em;margin-bottom:12px}
.checkout-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.checkout-row input{flex:1;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:10px 12px;color:#e8e8e8;font-size:0.9em;outline:none}
.checkout-row input:focus{border-color:#4ade80}
.checkout-row input::placeholder{color:#445566}
.coupon-select{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.coupon-chip{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;cursor:pointer;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.2);color:#8899aa;transition:all 0.2s}
.coupon-chip:hover{border-color:rgba(255,255,255,0.25)}
.coupon-chip.selected{border-color:#f5c842;background:rgba(245,200,66,0.1);color:#f0d878}
.coupon-chip:active{transform:scale(0.98)}
.coupon-chip .chip-badge{flex-shrink:0;font-size:0.78em;font-weight:700;padding:3px 10px;border-radius:10px;min-width:56px;text-align:center}
.coupon-chip .chip-badge.coupon-type{background:rgba(245,200,66,0.15);color:#f5c842}
.coupon-chip .chip-badge.discount-type{background:rgba(74,222,128,0.15);color:#4ade80}
.coupon-chip .chip-badge.bundle-type{background:rgba(96,165,250,0.15);color:#60a5fa}
.coupon-chip .chip-body{flex:1;min-width:0}
.coupon-chip .chip-rule{font-size:0.88em;font-weight:600;color:#e8e8e8}
.coupon-chip .chip-limit{font-size:0.72em;color:#667788;margin-top:2px}
.coupon-chip .chip-save{flex-shrink:0;font-size:0.78em;font-weight:700;color:#4ade80;display:none}
.coupon-chip .chip-save.show{display:block}

/* Calculation preview */
.calc-preview{background:rgba(0,0,0,0.25);border-radius:10px;padding:14px;margin-bottom:12px;font-size:0.82em}

.calc-line{display:flex;justify-content:space-between;padding:4px 0;color:#8899aa}
.calc-line.discount{color:#4ade80}
.calc-line.total{color:#f5c842;font-weight:700;font-size:1.1em;border-top:1px solid rgba(255,255,255,0.08);margin-top:4px;padding-top:8px}

/* Pay button */
.btn-pay{width:100%;padding:14px;border-radius:12px;font-size:1em;font-weight:700;cursor:pointer;border:none;background:linear-gradient(135deg,#f5c842,#d4a832);color:#0a1628;transition:all 0.2s}
.btn-pay:active{transform:scale(0.97)}
.btn-pay:disabled{opacity:0.5;cursor:not-allowed;background:rgba(255,255,255,0.06);color:#667788;border:1px solid rgba(255,255,255,0.1)}

/* History section */
.history-section{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:16px;margin:20px 0}
.history-section h3{color:#8ec8d8;font-size:0.9em;margin-bottom:12px}
.history-tabs{display:flex;gap:8px;margin-bottom:12px}
.history-tab{padding:5px 14px;border-radius:16px;font-size:0.78em;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#8899aa;transition:all 0.2s}
.history-tab.active{border-color:#f5c842;background:rgba(245,200,66,0.1);color:#f5c842}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.8em}
.history-item:last-child{border-bottom:none}
.history-badge{padding:2px 8px;border-radius:10px;font-size:0.75em;font-weight:600;flex-shrink:0}
.badge-issued{background:rgba(245,200,66,0.12);color:#f5c842}
.badge-used{background:rgba(74,222,128,0.12);color:#4ade80}
.badge-expired{background:rgba(248,113,113,0.1);color:#f87171}
.history-empty{color:#556677;font-size:0.78em;text-align:center;padding:12px}

/* Receipt */
.receipt{display:none;background:rgba(74,222,128,0.06);border:1px solid rgba(74,222,128,0.2);border-radius:14px;padding:20px;margin:16px 0;text-align:center}
.receipt.show{display:block}
.receipt h3{color:#4ade80;font-size:1.1em;margin-bottom:14px}
.receipt-table{width:100%;font-size:0.85em}
.receipt-table td{padding:6px 8px;color:#8899aa}
.receipt-table td:last-child{text-align:right;color:#e8e8e8}
.receipt-table tr.total td{color:#f5c842;font-weight:700;font-size:1.1em;border-top:1px dashed rgba(255,255,255,0.1);padding-top:10px}
.receipt .order-id{font-family:"SF Mono","Fira Code",monospace;font-size:0.72em;color:#556677;margin-top:12px}

/* Ingot Game */
.game-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.92);z-index:1000;align-items:center;justify-content:center;flex-direction:column}
.game-overlay.show{display:flex}
.game-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:#8899aa;font-size:1.2em;cursor:pointer;z-index:10}
.game-title{color:#f5c842;font-size:1em;margin-bottom:8px;font-weight:700}
.game-canvas-wrap{position:relative;background:linear-gradient(180deg,#1a0a2e 0%,#162447 40%,#0d3b1e 100%);border:2px solid rgba(245,200,66,0.25);border-radius:16px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.game-canvas{display:block;width:100%;height:100%}
.game-hud{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;width:100%;max-width:340px;color:#e8e8e8;font-size:0.85em;font-weight:600}
.game-hud .hud-score{color:#f5c842}
.game-hud .hud-timer{color:#8ec8d8}
.game-hud .hud-lives{color:#f87171}
.game-result{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;flex-direction:column;z-index:5;border-radius:16px}
.game-result.show{display:flex}
.game-result .result-title{font-size:1.4em;font-weight:700;margin-bottom:8px}
.game-result .result-title.win{color:#f5c842}
.game-result .result-title.lose{color:#f87171}
.game-result .result-score{color:#8899aa;font-size:0.9em;margin-bottom:12px}
.game-result .result-coupon{color:#4ade80;font-size:0.85em;margin-bottom:16px;text-align:center;line-height:1.5}
.btn-play{padding:12px 40px;border-radius:24px;font-size:1em;font-weight:700;cursor:pointer;border:none;background:linear-gradient(135deg,#f5c842,#d4a832);color:#0a1628}
.btn-play:disabled{opacity:0.4;cursor:not-allowed}
.btn-play.retry{background:linear-gradient(135deg,rgba(139,92,246,0.3),rgba(139,92,246,0.15));border:1px solid rgba(139,92,246,0.3);color:#a78bfa}
.game-remain{color:#667788;font-size:0.78em;margin-top:10px}
.game-tip{color:#667788;font-size:0.72em;margin-top:6px;text-align:center;line-height:1.4}

/* Game entry button */
.game-entry{text-align:center;margin:16px 0}
.btn-game{padding:10px 28px;border-radius:24px;font-size:0.88em;font-weight:700;cursor:pointer;border:1px dashed rgba(245,200,66,0.4);background:rgba(245,200,66,0.06);color:#f5c842;transition:all 0.2s}
.btn-game:active{transform:scale(0.95)}

/* Toast */
.toast{position:fixed;top:16px;left:16px;right:16px;padding:12px 18px;border-radius:12px;font-size:0.88em;font-weight:600;z-index:999;text-align:center;display:none;animation:slideDown 0.3s ease}
.toast.show{display:block}
.toast.success{background:#166534;border:1px solid #4ade80;color:#4ade80}
.toast.error{background:#7f1d1d;border:1px solid #f87171;color:#f87171}
@keyframes slideDown{from{transform:translateY(-40px);opacity:0}to{transform:translateY(0);opacity:1}}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:6px}

.footer{text-align:center;padding:20px 0;color:#445566;font-size:0.72em}

/* --- Login Page --- */
.login-wrap{text-align:center;padding:40px 20px}
.login-wrap h2{color:#f5c842;font-size:1.2em;margin-bottom:20px}
.login-field{margin-bottom:14px;text-align:left}
.login-field label{display:block;font-size:0.82em;color:#8ec8d8;margin-bottom:6px}
.login-field input{width:100%;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:12px 14px;color:#e8e8e8;font-size:0.92em;outline:none}
.login-field input:focus{border-color:#f5c842}
.sms-row{display:flex;gap:10px;align-items:flex-end}
.sms-row .login-field{flex:1;margin-bottom:0}
.btn-sms{background:linear-gradient(135deg,rgba(139,92,246,0.15),rgba(139,92,246,0.08));border:1.5px solid rgba(139,92,246,0.3);color:#a78bfa;width:auto;padding:10px 16px;font-size:0.82em;white-space:nowrap;flex-shrink:0;border-radius:10px;cursor:pointer;font-weight:600}
.btn-sms:active{transform:scale(0.95)}
.btn-sms:disabled{opacity:0.4;cursor:not-allowed}
.btn-login{width:100%;padding:14px;border-radius:12px;font-size:0.95em;font-weight:700;cursor:pointer;border:none;background:linear-gradient(135deg,#f5c842,#d4a017);color:#0a1628;letter-spacing:0.5px;margin-top:8px}
.btn-login:active{transform:scale(0.97)}
.btn-login:disabled{opacity:0.4;cursor:not-allowed;transform:none}

/* Logout */
.btn-logout{background:transparent;border:1px solid rgba(248,113,113,0.3);color:#f87171;padding:4px 12px;border-radius:6px;font-size:0.72em;cursor:pointer;position:absolute;top:12px;right:12px;z-index:10}
.header{position:relative}

#appMain{display:none}
#loginPage{display:block}
.order-detail{background:rgba(255,255,255,0.03);border-radius:8px;padding:10px 14px;margin:-4px 0 8px 0;font-size:13px}
.order-detail-row{display:flex;justify-content:space-between;padding:4px 0;color:#aab8c2}
.order-detail-row:last-child{color:#f5c842;border-top:1px solid rgba(255,255,255,0.06);margin-top:2px;padding-top:6px}
</style>
</head>
<body>

<!-- Login Page -->
<div id="loginPage">
  <div class="page">
    <div class="header" style="padding-bottom:10px">
      <div class="logo">🍺</div>
      <h1>国际啤酒节</h1>
      <div class="sub">扫码领券 · 畅享美酒</div>
    </div>
    <div class="login-wrap">
      <h2>手机号登录</h2>
      <div class="sms-row">
        <div class="login-field">
          <label>手机号</label>
          <input type="tel" id="loginPhone" placeholder="请输入11位手机号" maxlength="11" inputmode="numeric">
        </div>
        <button class="btn-sms" id="btnSendCode" onclick="sendLoginCode()">发送验证码</button>
      </div>
      <div class="login-field">
        <label>验证码</label>
        <input type="text" id="loginCode" placeholder="请输入6位验证码" maxlength="6" inputmode="numeric">
      </div>
      <button class="btn-login" id="btnLogin" onclick="doLogin()">登录 / 注册</button>
        <button class="btn-login" style="margin-top:8px;background:linear-gradient(135deg,rgba(139,92,246,0.2),rgba(139,92,246,0.1));border:1px solid rgba(139,92,246,0.3);color:#a78bfa" onclick="demoQuickLogin()">演示快速登录（免验证码）</button>
    </div>
    <div class="footer">国际啤酒节 · 智能营促销</div>
  </div>
</div>

<!-- Main App -->
<div id="appMain">
<div class="page">

  <div class="header">
    <div class="logo">🍺</div>
    <h1>国际啤酒节</h1>
    <div class="sub">扫码领券 · 畅享美酒</div>
    <div class="date">2026.08.06 — 08.20 · 主会场</div>
    <button class="btn-logout" onclick="doLogout()">退出</button>
  </div>

  <div class="act-bar">
    <div class="act-dot"></div>
    <select id="activitySelect" onchange="loadPromos()">
      <option value="">选择会场...</option>
    </select>
  </div>

  <div class="section-label">限时优惠</div>
  <div id="promoList"><div style="color:#556677;font-size:0.82em;text-align:center;padding:20px">请先选择会场</div></div>

  <div class="game-entry">
    <button class="btn-game" onclick="openGame()">👑 接元宝 · 赢优惠券</button>
    <div style="font-size:0.7em;color:#667788;margin-top:4px" id="gameRemainText">今日剩余 3 次</div>
  </div>

  <div class="menu-section" id="menuSection">
    <h3>🍽️ 点菜下单</h3>
    <div class="menu-cats" id="menuCats"></div>
    <div class="menu-grid" id="menuGrid"></div>
    <div class="cart-panel" id="cartPanel">
      <div id="cartItems"></div>
      <div class="cart-total">
        <span class="ct-label">合计</span>
        <span class="ct-amount" id="cartTotal">¥0</span>
      </div>
    </div>
  </div>

  <div class="checkout" id="checkoutSection">
    <h3>🧾 去结算</h3>
    <div class="coupon-select" id="couponChips">
      <span style="color:#556677;font-size:0.78em">请先领取优惠券</span>
    </div>
    <div class="checkout-row">
      <input type="number" id="orderAmount" value="128" min="1" placeholder="消费金额 ¥" oninput="updateCalc()">
    </div>
    <div class="calc-preview" id="calcPreview">
      <div class="calc-line"><span>原价</span><span id="calcOrig">¥0.00</span></div>
      <div class="calc-line discount"><span>优惠券抵扣</span><span id="calcDiscount">-¥0.00</span></div>
      <div class="calc-line total"><span>实付</span><span id="calcFinal">¥0.00</span></div>
    </div>
    <button class="btn-pay" id="btnPay" onclick="doPay()" disabled>确认支付</button>
  </div>

  <div class="receipt" id="receipt"></div>

	  <div class="history-section" id="historySection">
	    <h3>我的记录</h3>
	    <div class="history-tabs">
	      <button class="history-tab active" onclick="switchHistoryTab('coupons',this)">优惠券</button>
	      <button class="history-tab" onclick="switchHistoryTab('orders',this)">订单记录</button>
	    </div>

<script>
var API = '';
var myCoupons = {};     // {promoId: {code, name, promoData}}
var selectedCoupon = null;
var wheelSpinning = false;
var gameRemaining = 3;

// ---- Ingot Game Config ----
var GAME_DURATION = 30;
var GAME_MAX_LIVES = 3;
var GAME_PASS_SCORE = 15;
var GAME_MAX_ON_SCREEN = 4;
var GAME_CANVAS_W = 340;
var GAME_CANVAS_H = 480;

var gameRunning = false;
var gameScore = 0;
var gameLives = GAME_MAX_LIVES;
var gameTimeLeft = GAME_DURATION;
var gameItems = [];
var gamePlayerX = GAME_CANVAS_W / 2;
var gameLastSpawn = 0;
var gameStartTime = 0;
var gameAnimId = null;
var gameFirstPlay = true;
var gameLastTs = 0;

// 10-coupon reward pool (ops design)
var rewardPool = [
  {name:'全场9折', type:'discount', rule:{rate:0.9}, weight:15, tier:1},
  {name:'满50减10', type:'coupon', rule:{threshold:50,discount:10}, weight:15, tier:1},
  {name:'满100减30', type:'coupon', rule:{threshold:100,discount:30}, weight:12, tier:2},
  {name:'满200减60', type:'coupon', rule:{threshold:200,discount:60}, weight:8, tier:3},
  {name:'啤酒+烧烤套餐', type:'bundle', rule:{items:['beer','bbq'],price:88}, weight:10, tier:2},
  {name:'满2瓶送1瓶', type:'coupon', rule:{threshold:2,discount:0,desc:'买2得3'}, weight:8, tier:2},
  {name:'全场8折', type:'discount', rule:{rate:0.8}, weight:8, tier:3},
  {name:'小食免单券', type:'coupon', rule:{threshold:58,discount:58}, weight:6, tier:2},
  {name:'满300减50', type:'coupon', rule:{threshold:300,discount:50}, weight:6, tier:3},
  {name:'满168减68', type:'coupon', rule:{threshold:168,discount:68}, weight:4, tier:4}
];

function getPhase(elapsedSec) {
  if (elapsedSec < 7) return {name:'warmup', interval:700, speed:2.7, bombRate:0};
  if (elapsedSec < 18) return {name:'buildup', interval:550, speed:4.2, bombRate:0.03};
  return {name:'climax', interval:400, speed:5.8, bombRate:0.06};
}

function pickReward() {
  // First play guarantee: tier-1 only (全场9折 / 满50减10)
  var pool = gameFirstPlay ? rewardPool.filter(function(r){return r.tier===1;}) : rewardPool;
  var totalW = 0;
  pool.forEach(function(r){totalW += r.weight;});
  var roll = Math.random() * totalW;
  var acc = 0;
  for (var i = 0; i < pool.length; i++) {
    acc += pool[i].weight;
    if (roll <= acc) return pool[i];
  }
  return pool[0];
}

function matchRewardToPromo(reward) {
  var promos = window._loadedPromos || [];
  for (var i = 0; i < promos.length; i++) {
    var p = promos[i];
    if (p.type !== reward.type) continue;
    var r = typeof p.rule === 'string' ? JSON.parse(p.rule) : p.rule;
    if (reward.type === 'discount' && Math.abs(r.rate - reward.rule.rate) < 0.01) return p;
    if (reward.type === 'coupon' && r.threshold === reward.rule.threshold && r.discount === reward.rule.discount) return p;
    if (reward.type === 'bundle' && r.price === reward.rule.price) return p;
  }
  return null;
}

var token = null;
var userId = null;
var smsCountdown = 0;
var smsTimer = null;


// ---- Auth helpers ----

function getAuthHeaders() {
  var h = {'Content-Type':'application/json'};
  if (token) h['Authorization'] = 'Bearer ' + token;
  return h;
}

function isLoggedIn() {
  token = localStorage.getItem('bf_token');
  userId = localStorage.getItem('bf_user_id');
  return !!(token && userId);
}

// ---- Login Page ----

function sendLoginCode() {
  var phone = document.getElementById('loginPhone').value.trim();
  if (phone.length !== 11 || !/^\d{11}$/.test(phone)) {
    showToast('请输入正确的11位手机号', 'error');
    return;
  }
  if (smsCountdown > 0) return;

  var btn = document.getElementById('btnSendCode');
  btn.disabled = true;

  fetch(API + '/api/v1/auth/send-code', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({phone: phone})
  }).then(function(res) {
    return res.json().then(function(data) { return {ok: res.ok, data: data}; });
  }).then(function(r) {
    if (r.ok) {
      showToast('验证码已发送', 'success');
      smsCountdown = 60;
      btn.textContent = smsCountdown + 's';
      smsTimer = setInterval(function() {
        smsCountdown--;
        if (smsCountdown <= 0) {
          clearInterval(smsTimer);
          smsTimer = null;
          btn.textContent = '发送验证码';
          btn.disabled = false;
        } else {
          btn.textContent = smsCountdown + 's';
        }
      }, 1000);
    } else {
      showToast((r.data && r.data.error) || '发送失败', 'error');
      btn.disabled = false;
    }
  }).catch(function(e) {
    showToast('网络错误: ' + e.message, 'error');
    btn.disabled = false;
  });
}

function doLogin() {
  var phone = document.getElementById('loginPhone').value.trim();
  var code = document.getElementById('loginCode').value.trim();
  if (phone.length !== 11 || !/^\d{11}$/.test(phone)) {
    showToast('请输入正确的手机号', 'error');
    return;
  }
  if (code.length !== 6 || !/^\d{6}$/.test(code)) {
    showToast('请输入6位验证码', 'error');
    return;
  }

  var btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.textContent = '登录中...';

  fetch(API + '/api/v1/auth/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({phone: phone, code: code})
  }).then(function(res) {
    return res.json().then(function(data) { return {ok: res.ok, data: data}; });
  }).then(function(r) {
    if (r.ok && r.data.token) {
      token = r.data.token;
      userId = r.data.user_id;
      localStorage.setItem('bf_token', token);
      localStorage.setItem('bf_user_id', userId);
      showApp();
    } else {
      showToast((r.data && r.data.error) || '登录失败', 'error');
      btn.disabled = false;
      btn.textContent = '登录 / 注册';
    }
  }).catch(function(e) {
    showToast('网络错误: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = '登录 / 注册';
  });
}

function demoQuickLogin() {
  var btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.textContent = '演示登录中...';
  fetch(API + '/api/v1/auth/demo-login', {method:'POST'}).then(function(res){
    return res.json().then(function(data){return {ok:res.ok,data:data};});
  }).then(function(r){
    if (r.ok && r.data.token) {
      token = r.data.token;
      userId = r.data.user_id;
      localStorage.setItem('bf_token', token);
      localStorage.setItem('bf_user_id', userId);
      showApp();
    } else {
      showToast('演示登录失败', 'error');
      btn.disabled = false;
      btn.textContent = '登录 / 注册';
    }
  }).catch(function(e){
    showToast('网络错误: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = '登录 / 注册';
  });
}

function doLogout() {
  localStorage.removeItem('bf_token');
  localStorage.removeItem('bf_user_id');
  token = null;
  userId = null;
  myCoupons = {};
  selectedCoupon = null;
  gameRemaining = 3;
  clearCart();
  document.getElementById('appMain').style.display = 'none';
  document.getElementById('loginPage').style.display = 'block';
  document.getElementById('loginPhone').value = '';
  document.getElementById('loginCode').value = '';
}

// ---- App boot ----

function showApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appMain').style.display = 'block';
  initApp();
}

async function initApp() {
  await loadMyData();
  await loadActivities();
  initMenu();
  renderHistory();
}

var myOrders = [];

async function loadMyData() {
  try {
    var res = await fetch(API + '/api/v1/coupons/mine', {headers: getAuthHeaders()});
    if (res.status === 401) { doLogout(); return; }
    var coupons = await res.json();
    if (Array.isArray(coupons)) {
      coupons.forEach(function(c) {
        if (c.status === 'issued' && !myCoupons[c.promotion_id]) {
          myCoupons[c.promotion_id] = {code: c.code, name: '', status: c.status};
        }
      });
    }
  } catch(e) {}

  try {
    var ordRes = await fetch(API + '/api/v1/orders/mine', {headers: getAuthHeaders()});
    if (ordRes.status === 401) { doLogout(); return; }
    var orders = await ordRes.json();
    if (Array.isArray(orders)) { myOrders = orders; }
  } catch(e) {}
}

async function loadActivities() {
  try {
    var res = await fetch(API + '/api/v1/activities');
    var list = await res.json();
    var sel = document.getElementById('activitySelect');
    sel.innerHTML = '<option value="">选择会场...</option>';
    if (Array.isArray(list)) {
      list.forEach(function(a) {
        var opt = document.createElement('option');
        opt.value = a.id;
        opt.textContent = a.name;
        sel.appendChild(opt);
      });
      if (list.length > 0) {
        sel.value = list[list.length-1].id;
        await loadPromos();
      }
    }
  } catch(e) {
    showToast('加载失败: ' + e.message, 'error');
  }
}

async function loadPromos() {
  var aid = document.getElementById('activitySelect').value;
  if (!aid) return;

  try {
    var res = await fetch(API + '/api/v1/activities/' + aid + '/promotions');
    var promos = await res.json();
    var list = document.getElementById('promoList');
    list.innerHTML = '';

    if (!Array.isArray(promos) || promos.length === 0) {
      list.innerHTML = '<div style="color:#556677;font-size:0.82em;text-align:center;padding:20px">暂无优惠活动</div>';
      return;
    }

    window.promoMetas = {};
    window._loadedPromos = promos;
    promos.forEach(function(p) {
      if (p.status !== 'approved' && p.status !== 'active') return;

      var iconCls, icon, name, desc, limit;

      try {
        var rule = typeof p.rule === 'string' ? JSON.parse(p.rule) : p.rule;
        if (p.type === 'discount') {
          iconCls = 'green'; icon = (rule.rate*100).toFixed(0) + '折';
          name = p.name; desc = '全场' + (rule.rate*100).toFixed(0) + '折优惠'; limit = '不限门槛';
        } else if (p.type === 'coupon') {
          iconCls = 'gold'; icon = '¥' + rule.discount;
          name = p.name; desc = rule.desc || ('满' + rule.threshold + '减' + rule.discount); limit = '满¥' + rule.threshold + '可用';
        } else if (p.type === 'bundle') {
          iconCls = 'blue'; icon = '套餐';
          name = p.name; desc = (rule.items||[]).join('+'); limit = '特价 ¥' + rule.price;
        }
      } catch(e) {}
      window.promoMetas[p.id] = {type: p.type, desc: desc, limit: limit, name: name || p.name, rule: typeof p.rule === 'string' ? JSON.parse(p.rule) : p.rule};

      var claimed = !!myCoupons[p.id];
      var card = document.createElement('div');
      card.className = 'promo-card' + (claimed ? ' claimed' : '');
      card.id = 'promo-' + p.id;
      card.innerHTML =
        '<div class="promo-icon ' + iconCls + '">' + icon + '</div>' +
        '<div class="promo-info">' +
        '<div class="promo-name">' + escHtml(name || p.name) + '</div>' +
        '<div class="promo-desc">' + escHtml(desc || '') + '</div>' +
        '<div class="promo-limit">' + escHtml(limit || '') + '</div>' +
        '</div>' +
        '<button class="btn-claim' + (claimed ? ' got' : '') + '" id="btn-claim-' + p.id + '" onclick="claimOne(\'' + p.id + '\')">' +
        (claimed ? '已领取 ✓' : '立即领取') +
        '</button>';
      list.appendChild(card);
    });

    // Backfill myCoupons metadata from promoMetas (fix refresh blank chips)
    var ids = Object.keys(myCoupons);
    ids.forEach(function(id) {
      var meta = window.promoMetas[id];
      if (meta && !myCoupons[id].type) {
        myCoupons[id].type = meta.type;
        myCoupons[id].desc = meta.desc;
        myCoupons[id].limit = meta.limit;
        myCoupons[id].name = myCoupons[id].name || meta.name;
      }
    });

    updateCouponChips();
  } catch(e) {
    showToast('加载优惠失败', 'error');
  }
}

async function claimOne(promoId) {
  if (myCoupons[promoId]) { showToast('已领取过此券', 'error'); return; }

  var btn = document.getElementById('btn-claim-' + promoId);
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-inline"></span>领取中';

  try {
    var res = await fetch(API + '/api/v1/coupons', {
      method: 'POST',
      headers: getAuthHeaders(),
      body: JSON.stringify({promotion_id: promoId})
    });

    if (res.status === 401) {
      showToast('登录已过期，请重新登录', 'error');
      doLogout();
      return;
    }

    var data = await res.json();

    if (data.code) {
      var promoCard = document.getElementById('promo-' + promoId);
      var promoName = promoCard ? promoCard.querySelector('.promo-name').textContent : '优惠券';
      var promoDesc = promoCard ? promoCard.querySelector('.promo-desc').textContent : '';
      var promoLimit = promoCard ? promoCard.querySelector('.promo-limit').textContent : '';
      var promoType = window.promoMetas && window.promoMetas[promoId] ? window.promoMetas[promoId].type : 'coupon';

      myCoupons[promoId] = {code: data.code, name: promoName, desc: promoDesc, limit: promoLimit, type: promoType, status: 'issued'};
      renderHistory();
      btn.textContent = '已领取 ✓';
      btn.className = 'btn-claim got';
      btn.disabled = false;
      document.getElementById('promo-' + promoId).classList.add('claimed');

      selectedCoupon = promoId;
      updateCouponChips();
      showToast('领取成功！', 'success');
    }
  } catch(e) {
    btn.textContent = '立即领取';
    btn.disabled = false;
    showToast('领取失败: ' + e.message, 'error');
  }
}

function updateCouponChips() {
  var container = document.getElementById('couponChips');
  var ids = Object.keys(myCoupons);
  // Filter out orphaned coupons whose promotions no longer exist / have no metadata
  var validIds = ids.filter(function(id) {
    var c = myCoupons[id];
    return c.type || c.name || c.desc;
  });
  // Drop orphaned entries so they don't accumulate
  ids.forEach(function(id) {
    var c = myCoupons[id];
    if (!c.type && !c.name && !c.desc) delete myCoupons[id];
  });
  if (selectedCoupon && !myCoupons[selectedCoupon]) selectedCoupon = null;
  if (validIds.length === 0) {
    container.innerHTML = '<span style="color:#556677;font-size:0.78em">请先领取优惠券</span>';
  } else {
    var html = '';
    validIds.forEach(function(id) {
      var c = myCoupons[id];
      var sel = selectedCoupon === id;
      var badgeCls = c.type === 'discount' ? 'discount-type' : (c.type === 'bundle' ? 'bundle-type' : 'coupon-type');
      var badgeText = c.type === 'discount' ? '折扣' : (c.type === 'bundle' ? '套餐' : '满减');
      var ruleText = c.desc || c.name;
      var limitText = c.limit || '';
      html += '<div class="coupon-chip' + (sel ? ' selected' : '') + '" onclick="selectCoupon(\'' + id + '\')">' +
        '<span class="chip-badge ' + badgeCls + '">' + escHtml(badgeText) + '</span>' +
        '<span class="chip-body">' +
        '<div class="chip-rule">' + escHtml(ruleText) + '</div>' +
        (limitText ? '<div class="chip-limit">' + escHtml(limitText) + '</div>' : '') +
        '</span>' +
        '<span class="chip-save" id="chip-save-' + id + '">可省 ¥0</span>' +
        '</div>';
    });
    container.innerHTML = html;
    updateChipSavings();
  }
  updateCalc();
}

function updateChipSavings() {
  var amount = parseFloat(document.getElementById('orderAmount').value) || 0;
  var ids = Object.keys(myCoupons);
  ids.forEach(function(id) {
    var el = document.getElementById('chip-save-' + id);
    if (!el) return;
    el.classList.remove('show');
    if (amount <= 0) return;
    var meta = window.promoMetas && window.promoMetas[id];
    if (!meta || !meta.rule) return;
    try {
      var disc = 0;
      if (meta.type === 'discount') {
        disc = amount * (1 - meta.rule.rate);
      } else if (meta.type === 'coupon') {
        disc = amount >= meta.rule.threshold ? meta.rule.discount : 0;
      } else if (meta.type === 'bundle') {
        disc = Math.max(0, amount - meta.rule.price);
      }
      if (disc > 0) {
        el.textContent = '可省 ¥' + disc.toFixed(0);
        el.classList.add('show');
      }
    } catch(e) {}
  });
}

function selectCoupon(id) {
  selectedCoupon = (selectedCoupon === id) ? null : id;
  updateCouponChips();
}

function updateCalc() {
  var amount = parseFloat(document.getElementById('orderAmount').value) || 0;
  var btnPay = document.getElementById('btnPay');
  updateChipSavings();

  // Always show calc preview
  document.getElementById('calcOrig').textContent = '¥' + amount.toFixed(2);

  if (!selectedCoupon) {
    // No coupon — allow pay at full price
    document.getElementById('calcDiscount').textContent = '-¥0.00（未使用优惠券）';
    document.getElementById('calcFinal').textContent = '¥' + amount.toFixed(2);
    btnPay.disabled = amount <= 0;
    btnPay.textContent = amount > 0 ? '原价支付' : '请输入金额';
    return;
  }

  // Coupon selected — fetch and calculate discount
  try {
    var aid = document.getElementById('activitySelect').value;
    fetch(API + '/api/v1/activities/' + aid + '/promotions').then(function(res) {
      return res.json();
    }).then(function(promos) {
      if (Array.isArray(promos)) {
        var p = promos.find(function(x) { return x.id === selectedCoupon; });
        if (p) {
          var rule = typeof p.rule === 'string' ? JSON.parse(p.rule) : p.rule;
          var disc = 0;
          if (p.type === 'discount') {
            disc = amount * (1 - rule.rate);
          } else if (p.type === 'coupon') {
            disc = amount >= rule.threshold ? rule.discount : 0;
          } else if (p.type === 'bundle') {
            disc = Math.max(0, amount - rule.price);
          }
          var final = Math.max(0, amount - disc);
          document.getElementById('calcDiscount').textContent = '-¥' + disc.toFixed(2);
          document.getElementById('calcFinal').textContent = '¥' + final.toFixed(2);
          btnPay.disabled = amount <= 0;
          btnPay.textContent = disc > 0 ? '使用优惠支付 ¥' + final.toFixed(0) : '确认支付';
        }
      }
    });
  } catch(e) {}
}

document.addEventListener('DOMContentLoaded', function() {
  var el = document.getElementById('orderAmount');
  if (el) el.addEventListener('input', updateCalc);
});

async function doPay() {
  var amount = parseFloat(document.getElementById('orderAmount').value) || 0;
  if (amount <= 0) { showToast('请输入消费金额', 'error'); return; }

  var btnPay = document.getElementById('btnPay');
  btnPay.disabled = true;
  btnPay.innerHTML = '<span class="spinner"></span>支付中...';

  try {
    var aid = document.getElementById('activitySelect').value;
    var discount = 0, finalAmount = amount, discountLabel = '';
    var coupon = selectedCoupon ? myCoupons[selectedCoupon] : null;

    if (coupon) {
      // Calculate discount
      var promosRes = await fetch(API + '/api/v1/activities/' + aid + '/promotions');
      var promos = await promosRes.json();
      var promo = (Array.isArray(promos) ? promos.find(function(x) { return x.id === selectedCoupon; }) : null);
      var rule = promo ? (typeof promo.rule === 'string' ? JSON.parse(promo.rule) : promo.rule) : null;
      discountLabel = coupon.name;
      if (rule) {
        if (promo.type === 'discount') discount = amount * (1 - rule.rate);
        else if (promo.type === 'coupon') discount = amount >= rule.threshold ? rule.discount : 0;
        else if (promo.type === 'bundle') discount = Math.max(0, amount - rule.price);
      }
      finalAmount = Math.max(0, amount - discount);
    }

    // Create order
    var orderRes = await fetch(API + '/api/v1/orders', {
      method: 'POST',
      headers: getAuthHeaders(),
      body: JSON.stringify({
        activity_id: aid,
        amount: finalAmount,
        coupon_code: coupon ? coupon.code : '',
        original_amount: amount,
        discount_amount: discount
      })
    });
    var orderData = await orderRes.json();
    var orderId = orderData.id || ('ORD-' + Date.now().toString(36).toUpperCase());

    // Use coupon if selected
    if (coupon) {
      await fetch(API + '/api/v1/coupons/' + encodeURIComponent(coupon.code) + '/use', {

function renderMenuCats() {

function switchMenuCat(catId) {

function renderMenuItems() {
  var cat = menuData.find(function(c) { return c.id === menuActiveCat; });
  if (!cat) return;
  var html = '';
  cat.items.forEach(function(item) {
    var inCart = menuCart[item.id];
    html += '<div class="menu-item" onclick="addToCart(\'' + item.id + '\')">' +
      '<div class="mi-name">' + escHtml(item.name) + '</div>' +

function findMenuItem(id) {
  for (var i = 0; i < menuData.length; i++) {
    var items = menuData[i].items;
    for (var j = 0; j < items.length; j++) {
      if (items[j].id === id) return items[j];
    }
  }
  return null;
}

function addToCart(itemId) {
  var item = findMenuItem(itemId);
  if (!item) return;
  if (menuCart[itemId]) {
    menuCart[itemId].qty++;
  } else {
    menuCart[itemId] = {item: item, qty: 1};
  }
  renderMenuItems();
  renderCart();
  updateCartTotal();
}

function removeFromCart(itemId) {
  if (!menuCart[itemId]) return;
  menuCart[itemId].qty--;
  if (menuCart[itemId].qty <= 0) {
    delete menuCart[itemId];
  }
  renderMenuItems();
  renderCart();
  updateCartTotal();
}

        '</div>';

function updateCartTotal() {

function initCanvas() {

  // Draw idle state

  ctx.clearRect(0, 0, GAME_CANVAS_W, GAME_CANVAS_H);

  ctx.font = 'bold 16px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('按「开始游戏」接元宝', GAME_CANVAS_W/2, GAME_CANVAS_H/2 - 10);
  ctx.fillText('≥' + GAME_PASS_SCORE + '分赢优惠券', GAME_CANVAS_W/2, GAME_CANVAS_H/2 + 18);

  drawPlayer(ctx, GAME_CANVAS_W/2);
  canvas.addEventListener('touchmove', handleGameTouch, {passive: false});
  canvas.addEventListener('touchstart', handleGameTouch, {passive: false});

function drawPlayer(ctx, x) {
  var pw = 64, ph = 40, py = GAME_CANVAS_H - 55;
  ctx.save();
  // Cup body
  var grad = ctx.createLinearGradient(x - pw/2, py, x + pw/2, py + ph);
  grad.addColorStop(0, '#f5c842');
  grad.addColorStop(0.5, '#e6b800');
  grad.addColorStop(1, '#c8920a');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(x - pw/2, py);
  ctx.lineTo(x - pw/2 + 10, py + ph);
  ctx.lineTo(x + pw/2 - 10, py + ph);
  ctx.lineTo(x + pw/2, py);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // Foam top
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.ellipse(x, py, pw/2 - 2, 6, 0, Math.PI, 0);
  ctx.fill();
  ctx.restore();
}

function drawItem(ctx, item) {
  ctx.save();
  if (item.type === 'bomb') {
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(item.x, item.y, item.r, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#f87171';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💣', item.x, item.y);
  } else if (item.type === 'life') {
    ctx.fillStyle = '#4ade80';
    ctx.beginPath();
    ctx.arc(item.x, item.y, item.r, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🍺', item.x, item.y);
  } else if (item.type === 'golden') {
    // Golden ingot
    var g = ctx.createRadialGradient(item.x-3, item.y-3, 2, item.x, item.y, item.r);
    g.addColorStop(0, '#ffe066');
    g.addColorStop(0.7, '#ff6b35');
    g.addColorStop(1, '#cc4400');
    ctx.fillStyle = g;
    roundRect(ctx, item.x - item.r, item.y - item.r/1.5, item.r*2, item.r*2.5, 5);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('大宝', item.x, item.y);
  } else {
    // Normal ingot
    var gn = ctx.createLinearGradient(item.x - item.r, item.y - item.r, item.x + item.r, item.y + item.r);
    gn.addColorStop(0, '#f5c842');
    gn.addColorStop(1, '#c8920a');
    ctx.fillStyle = gn;
    roundRect(ctx, item.x - item.r, item.y - item.r/1.5, item.r*2, item.r*2.5, 5);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function spawnItem(phase) {
  if (gameItems.length >= GAME_MAX_ON_SCREEN) return;
  var types = ['normal','normal','normal','normal','normal','normal','normal','normal','golden','life'];
  // Determine if bomb based on phase bombRate
  var isBomb = Math.random() < phase.bombRate;

  var type;
  if (isBomb) {
    type = 'bomb';
  } else {
    // Weighted pick from normal(77%) / golden(15%) / life(8%) — relative when no bomb
    var r = Math.random();
    if (r < 0.08) type = 'life';
    else if (r < 0.23) type = 'golden';
    else type = 'normal';
  }

  var scoreMap = {normal:1, golden:3, bomb:0, life:0};
  var rMap = {normal:16, golden:18, bomb:15, life:16};

  gameItems.push({
    type: type,
    x: 30 + Math.random() * (GAME_CANVAS_W - 60),
    y: -20,
    r: rMap[type],
    score: scoreMap[type],
    speed: phase.speed + Math.random() * 0.8
  });
}

function startGame() {
  if (gameRemaining <= 0) {
    showToast('今日游戏次数已用完', 'error');
    return;
  }

  gameRunning = true;
  gameScore = 0;
  gameLives = GAME_MAX_LIVES;
  gameTimeLeft = GAME_DURATION;
  gameItems = [];
  gamePlayerX = GAME_CANVAS_W / 2;
  gameLastSpawn = 0;
  gameStartTime = performance.now();
  gameLastTs = gameStartTime;
  gameAnimId = null;

  document.getElementById('btnPlay').style.display = 'none';
  document.getElementById('gameResult').classList.remove('show');
  document.getElementById('gameHud').style.display = 'flex';
  document.getElementById('gameTitle').textContent = '游戏中...';
  document.getElementById('gameRemain').textContent = '今日剩余 ' + gameRemaining + ' 次';
  updateHUD();

  gameAnimId = requestAnimationFrame(gameLoop);
}

function gameLoop(timestamp) {
  if (!gameRunning) return;

  var elapsed = (timestamp - gameStartTime) / 1000;
  gameTimeLeft = Math.max(0, GAME_DURATION - elapsed);
  var phase = getPhase(elapsed);
  var dt = Math.min((timestamp - gameLastTs) / 1000, 0.1);
  gameLastTs = timestamp;

  // Spawn
  if (timestamp - gameLastSpawn > phase.interval) {
    spawnItem(phase);
    gameLastSpawn = timestamp;
  }

  // Update items
  for (var i = gameItems.length - 1; i >= 0; i--) {
    var item = gameItems[i];
    item.y += item.speed * dt * 60;

    // Check collision with player
    var pw = 64, ph = 40, py = GAME_CANVAS_H - 55;
    if (item.y + item.r > py && item.y - item.r < py + ph &&
        item.x + item.r > gamePlayerX - pw/2 && item.x - item.r < gamePlayerX + pw/2) {
      if (item.type === 'bomb') {
        gameLives--;
      } else if (item.type === 'life') {
        gameLives = Math.min(gameLives + 2, GAME_MAX_LIVES);
      } else {
        gameScore += item.score;
      }
      gameItems.splice(i, 1);
      continue;
    }

    // Remove if off screen
    if (item.y - item.r > GAME_CANVAS_H) {
      gameItems.splice(i, 1);
    }
  }

  // Check game over conditions
  if (gameLives <= 0 || gameTimeLeft <= 0) {
    endGame();
    return;
  }

  // Render
  var canvas = document.getElementById('gameCanvas');
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, GAME_CANVAS_W, GAME_CANVAS_H);

  // Draw background particles
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  for (var j = 0; j < 8; j++) {
    ctx.beginPath();
    ctx.arc((j*47+timestamp*0.01)%GAME_CANVAS_W, (j*61+timestamp*0.03)%GAME_CANVAS_H, 2, 0, Math.PI*2);
    ctx.fill();
  }

  // Draw items
  for (var k = 0; k < gameItems.length; k++) {
    drawItem(ctx, gameItems[k]);
  }

  // Draw player
  drawPlayer(ctx, gamePlayerX);

  updateHUD();
  gameAnimId = requestAnimationFrame(gameLoop);
}

function updateHUD() {
  document.getElementById('hudScore').textContent = gameScore;
  document.getElementById('hudTimer').textContent = Math.ceil(gameTimeLeft) + 's';
  var hearts = '';
  for (var i = 0; i < gameLives; i++) hearts += '❤️';
  document.getElementById('hudLives').textContent = hearts || '💔';
}

function endGame() {
  gameRunning = false;
  if (gameAnimId) { cancelAnimationFrame(gameAnimId); gameAnimId = null; }

  gameRemaining--;
  document.getElementById('gameRemain').textContent = '今日剩余 ' + gameRemaining + ' 次';
  document.getElementById('gameRemainText').textContent = '今日剩余 ' + gameRemaining + ' 次';
  document.getElementById('gameTitle').textContent = '游戏结束';

  var win = gameScore >= GAME_PASS_SCORE;
  var resultDiv = document.getElementById('gameResult');
  document.getElementById('resultTitle').textContent = win ? '🎉 通关！' : '😢 再接再厉';
  document.getElementById('resultTitle').className = 'result-title ' + (win ? 'win' : 'lose');
  document.getElementById('resultScore').textContent = '得分: ' + gameScore + ' (通关线 ' + GAME_PASS_SCORE + ' 分)';

  if (win) {
    var reward = pickReward();
    document.getElementById('resultCoupon').innerHTML = '🏆 ' + escHtml(reward.name) + '<br><small style="color:#8899aa">正在领取...</small>';
    document.getElementById('btnRetry').style.display = 'none';

    // Try to claim matching promo
    var aid = document.getElementById('activitySelect').value;
    if (aid && window._loadedPromos && window._loadedPromos.length > 0) {
      var match = matchRewardToPromo(reward);
      if (match && !myCoupons[match.id]) {
        claimOne(match.id);
        document.getElementById('resultCoupon').innerHTML = '🏆 ' + escHtml(reward.name) + '<br><small style="color:#8899aa">游戏专属奖励 · 已自动领取，可与限时优惠叠加使用</small>';
      } else if (match && myCoupons[match.id]) {
        document.getElementById('resultCoupon').innerHTML = '🏆 ' + escHtml(reward.name) + '<br><small style="color:#8899aa">游戏专属奖励 · 该券已在你券包中</small>';
      }
    }
    gameFirstPlay = false;
  } else {
    document.getElementById('resultCoupon').textContent = '';
    if (gameRemaining > 0) {
      document.getElementById('btnRetry').style.display = '';
    }
  }

  resultDiv.classList.add('show');
  document.getElementById('btnPlay').style.display = '';
  document.getElementById('btnPlay').disabled = true;
  document.getElementById('btnPlay').textContent = '今日次数用完';
  document.getElementById('btnPlay').className = 'btn-play';
  if (gameRemaining > 0) {
    document.getElementById('btnPlay').disabled = false;
    document.getElementById('btnPlay').textContent = '再玩一局';
  }
}

function retryGame() {
  document.getElementById('gameResult').classList.remove('show');
  startGame();
}

function handleGameTouch(e) {
  if (!gameRunning) return;
  e.preventDefault();
  var canvas = document.getElementById('gameCanvas');
  var rect = canvas.getBoundingClientRect();
  var scaleX = GAME_CANVAS_W / rect.width;
  var touch = e.touches[0];
  gamePlayerX = Math.max(32, Math.min(GAME_CANVAS_W - 32, (touch.clientX - rect.left) * scaleX));
}

function handleGameMouse(e) {
  if (!gameRunning) return;
  var canvas = document.getElementById('gameCanvas');
  var rect = canvas.getBoundingClientRect();
  var scaleX = GAME_CANVAS_W / rect.width;
  gamePlayerX = Math.max(32, Math.min(GAME_CANVAS_W - 32, (e.clientX - rect.left) * scaleX));
}

function handleGameKey(e) {
  if (!gameRunning) return;
  if (e.key === 'ArrowLeft' || e.key === 'a') gamePlayerX = Math.max(32, gamePlayerX - 20);
  if (e.key === 'ArrowRight' || e.key === 'd') gamePlayerX = Math.min(GAME_CANVAS_W - 32, gamePlayerX + 20);
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._timeout);
  t._timeout = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

  } else {
    if (myOrders.length === 0) {
      container.innerHTML = '<div class="history-empty">暂无订单记录</div>';
      return;
    }
    var html = '';
    myOrders.forEach(function(o, idx) {
      var dt = o.created_at ? o.created_at.substring(0, 19).replace('T',' ') : '';
      var hasCoupon = o.coupon_code && o.original_amount > 0;
      var couponMark = hasCoupon ? ' <span style="color:#4ade80;font-size:12px">&#x1F3AB;</span>' : '';
      html += '<div class="history-item" onclick="toggleOrderDetail(' + idx + ')" style="cursor:pointer">';
      html += '<span>' + escHtml(dt) + couponMark + ' 订单</span>';
      html += '<span style="color:#f5c842;font-weight:600">￥' + parseFloat(o.amount).toFixed(2) + '</span>';
      html += '</div>';
      if (hasCoupon) {
        html += '<div id="orderDetail-' + idx + '" class="order-detail" style="display:none">';
        html += '<div class="order-detail-row"><span>原价</span><span>¥' + parseFloat(o.original_amount).toFixed(2) + '</span></div>';
        html += '<div class="order-detail-row"><span>优惠券 (' + escHtml(o.coupon_code) + ')</span><span style="color:#4ade80">-¥' + parseFloat(o.discount_amount).toFixed(2) + '</span></div>';
        html += '<div class="order-detail-row" style="font-weight:600"><span>实付</span><span>¥' + parseFloat(o.amount).toFixed(2) + '</span></div>';
        html += '</div>';
      }
    });
    container.innerHTML = html;
  }
}

function escHtml(s) {
  return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Boot
if (isLoggedIn()) {
  showApp();
} else {
  document.getElementById('loginPage').style.display = 'block';
  document.getElementById('appMain').style.display = 'none';
}
</script>
