<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>啤酒节 · </title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;background:linear-gradient(180deg,#0a1628 0%,#132a42 50%,#0d3b1e 100%);min-height:100vh;color:#e8e8e8;-webkit-tap-highlight-color:transparent}
.container{max-width:480px;margin:0 auto;padding:16px}

/* Header */
.header{text-align:center;padding:20px 0 16px}
.header .logo{font-size:2.4em;margin-bottom:4px}
.header h1{font-size:1.3em;color:#f5c842;text-shadow:0 2px 12px rgba(245,200,66,0.25);margin-bottom:4px}
.header .sub{font-size:0.82em;color:#7eb8d8}

/* Activity Selector */
.act-selector{padding:10px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;margin-bottom:16px;font-size:0.85em;color:#8ec8e8;text-align:center}
.act-selector select{background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:8px 12px;color:#e8e8e8;font-size:0.88em;width:100%;margin-top:6px;outline:none}
.act-selector select:focus{border-color:#f5c842}

/* Promotion Cards */
.section-title{font-size:0.85em;color:#7eb8d8;margin-bottom:10px;padding-left:4px}
.promo-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.promo-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4em;flex-shrink:0}
.promo-icon.discount{background:rgba(74,222,128,0.15);color:#4ade80}
.promo-icon.coupon{background:rgba(245,200,66,0.15);color:#f5c842}
.promo-icon.bundle{background:rgba(96,165,250,0.15);color:#60a5fa}
.promo-info{flex:1;min-width:0}
.promo-name{font-weight:600;font-size:0.92em;color:#f0f0f0;margin-bottom:2px}
.promo-type{font-size:0.75em;color:#667788}
.promo-rule{font-size:0.78em;color:#8ec8e8;margin-top:2px}

/* Action Buttons */
.actions{display:flex;flex-direction:column;gap:10px;margin:20px 0}
.btn{width:100%;padding:14px;border-radius:12px;font-size:0.95em;font-weight:700;cursor:pointer;border:none;transition:all 0.2s;text-align:center;letter-spacing:0.5px}
.btn:active{transform:scale(0.97)}
.btn-claim{background:linear-gradient(135deg,rgba(245,200,66,0.2),rgba(245,200,66,0.1));border:1.5px solid rgba(245,200,66,0.4);color:#f5c842}
.btn-claim:hover{background:linear-gradient(135deg,rgba(245,200,66,0.3),rgba(245,200,66,0.15))}
.btn-order{background:linear-gradient(135deg,rgba(74,222,128,0.15),rgba(74,222,128,0.08));border:1.5px solid rgba(74,222,128,0.3);color:#4ade80}
.btn-order:hover{background:linear-gradient(135deg,rgba(74,222,128,0.25),rgba(74,222,128,0.12))}
.btn-use{background:linear-gradient(135deg,rgba(96,165,250,0.15),rgba(96,165,250,0.08));border:1.5px solid rgba(96,165,250,0.3);color:#60a5fa}
.btn-use:hover{background:linear-gradient(135deg,rgba(96,165,250,0.25),rgba(96,165,250,0.12))}
.btn:disabled{opacity:0.35;cursor:not-allowed;transform:none}
.btn .spinner{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Coupon Display */
.coupon-display{background:linear-gradient(135deg,rgba(245,200,66,0.08),rgba(245,200,66,0.02));border:2px dashed rgba(245,200,66,0.3);border-radius:16px;padding:20px;text-align:center;margin:12px 0;display:none}
.coupon-display.show{display:block}
.coupon-code{font-family:"SF Mono","Fira Code",monospace;font-size:1.3em;font-weight:700;color:#f5c842;letter-spacing:2px;word-break:break-all;margin:8px 0}
.coupon-label{font-size:0.78em;color:#8899aa}

/* Result Panel */
.result-panel{background:#0a1628;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px;margin-top:12px;display:none;max-height:260px;overflow-y:auto}
.result-panel.show{display:block}
.result-panel .http{font-size:0.75em;color:#667788;margin-bottom:6px;font-family:"SF Mono","Fira Code",monospace}
.result-panel .json{font-family:"SF Mono","Fira Code",monospace;font-size:0.75em;color:#4ade80;white-space:pre-wrap;word-break:break-all}
.result-panel.error .json{color:#f87171}

/* Order Form */
.order-form{display:flex;gap:8px;margin-bottom:10px;display:none}
.order-form.show{display:flex}
.order-form input{flex:1;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:10px 12px;color:#e8e8e8;font-size:0.9em;outline:none}
.order-form input:focus{border-color:#4ade80}

/* Toast */
.toast{position:fixed;top:16px;left:16px;right:16px;padding:12px 18px;border-radius:12px;font-size:0.88em;font-weight:600;z-index:999;text-align:center;display:none;animation:slideDown 0.3s ease}
.toast.show{display:block}
.toast.success{background:#166534;border:1px solid #4ade80;color:#4ade80}
.toast.error{background:#7f1d1d;border:1px solid #f87171;color:#f87171}
@keyframes slideDown{from{transform:translateY(-40px);opacity:0}to{transform:translateY(0);opacity:1}}

/* Status Badge */
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:0.75em;font-weight:600}
.status-badge.online{background:rgba(74,222,128,0.12);color:#4ade80}
.status-badge.offline{background:rgba(248,113,113,0.12);color:#f87171}
.status-dot{width:6px;height:6px;border-radius:50%}
.status-dot.online{background:#4ade80}
.status-dot.offline{background:#f87171}

.footer{text-align:center;padding:24px 0;color:#445566;font-size:0.75em}
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo">🍺</div>
    <h1>国际啤酒节</h1>
    <div class="sub"> · 智能营促销系统</div>
    <div style="margin-top:8px">
      <span class="status-badge" id="statusBadge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">检测中...</span>
      </span>
    </div>
  </div>

  <!-- Activity Selector -->
  <div class="act-selector">
    当前活动
    <select id="activitySelect" onchange="loadPromos()">
      <option value="">-- 选择活动 --</option>
    </select>
  </div>

  <!-- Promotions -->
  <div id="promoSection" style="display:none">
    <div class="section-title">可领取优惠</div>
    <div id="promoList"></div>
  </div>

  <!-- Coupon Display -->
  <div class="coupon-display" id="couponDisplay">
    <div class="coupon-label">我的优惠券</div>
    <div class="coupon-code" id="couponCode">--</div>
    <div style="font-size:0.75em;color:#667788;margin-top:4px" id="couponStatus">待使用</div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-claim" id="btnClaim" onclick="claimCoupon()" disabled>
      领取欢迎券
    </button>
    <button class="btn btn-order" id="btnOrder" onclick="showOrderForm()" disabled>
      下单消费
    </button>
    <div class="order-form" id="orderForm">
      <input type="number" id="orderAmount" value="128" min="1" max="9999" placeholder="消费金额 ¥">
      <button class="btn btn-order" style="width:auto;padding:10px 18px;font-size:0.82em;white-space:nowrap" onclick="placeOrder()">确认下单</button>
    </div>
    <button class="btn btn-use" id="btnUse" onclick="useCoupon()" disabled>
      核销优惠券
    </button>
  </div>

  <!-- Result Panel -->
  <div class="result-panel" id="resultPanel">
    <div class="http" id="resultHttp"></div>
    <div class="json" id="resultJson"></div>
  </div>

  <div class="footer">
    beerfest-api v1.0 · Demo 演示
  </div>
</div>

<script>
var API = '';

var myCouponCode = null;
var myPromoId = null;

// Init
async function init() {
  await checkAPI();
  await loadActivities();
}

async function checkAPI() {
  try {
    var res = await fetch(API + '/api/v1/ping');
    var data = await res.json();
    var ok = data === 'ok' || (data && data.status === 'ok');
    setStatus(ok);
  } catch(e) {
    setStatus(false);
  }
}

function setStatus(ok) {
  var badge = document.getElementById('statusBadge');
  var dot = document.getElementById('statusDot');
  var txt = document.getElementById('statusText');
  if (ok) {
    badge.className = 'status-badge online';
    dot.className = 'status-dot online';
    txt.textContent = '系统在线';
  } else {
    badge.className = 'status-badge offline';
    dot.className = 'status-dot offline';
    txt.textContent = '系统离线';
  }
}

async function loadActivities() {
  try {
    var res = await fetch(API + '/api/v1/activities');
    var list = await res.json();
    var sel = document.getElementById('activitySelect');
    sel.innerHTML = '<option value="">-- 选择活动 --</option>';
    if (Array.isArray(list)) {
      list.forEach(function(a) {
        var opt = document.createElement('option');
        opt.value = a.id;
        opt.textContent = a.name;
        sel.appendChild(opt);
      });
      if (list.length > 0) {
        sel.value = list[list.length-1].id;
        await loadPromos();
      }
    }
  } catch(e) {
    showToast('加载活动失败: ' + e.message, 'error');
  }
}

async function loadPromos() {
  var aid = document.getElementById('activitySelect').value;
  if (!aid) return;

  document.getElementById('btnClaim').disabled = true;
  document.getElementById('btnOrder').disabled = true;
  document.getElementById('promoSection').style.display = 'none';

  try {
    var res = await fetch(API + '/api/v1/activities/' + aid + '/promotions');
    var promos = await res.json();
    var list = document.getElementById('promoList');
    list.innerHTML = '';

    if (!Array.isArray(promos) || promos.length === 0) {
      list.innerHTML = '<div style="color:#667788;font-size:0.85em;padding:12px;text-align:center">暂无促销活动</div>';
      document.getElementById('promoSection').style.display = 'block';
      return;
    }

    var approved = promos.filter(function(p) { return p.status === 'approved' || p.status === 'active'; });
    if (approved.length === 0) {
      list.innerHTML = '<div style="color:#667788;font-size:0.85em;padding:12px;text-align:center">促销审核中</div>';
      document.getElementById('promoSection').style.display = 'block';
      return;
    }

    myPromoId = approved[0].id;

    approved.forEach(function(p) {
      var iconCls = 'discount';
      var icon = '%';
      var ruleText = '';
      try {
        var rule = typeof p.rule === 'string' ? JSON.parse(p.rule) : p.rule;
        if (p.type === 'discount') { iconCls = 'discount'; icon = '%'; ruleText = (rule.rate*100).toFixed(0) + '折'; }
        else if (p.type === 'coupon') { iconCls = 'coupon'; icon = '￥'; ruleText = '满' + rule.threshold + '减' + rule.discount; }
        else if (p.type === 'bundle') { iconCls = 'bundle'; icon = '#'; ruleText = (rule.items||[]).join('+') + ' ¥' + rule.price; }
      } catch(e) {}

      var card = document.createElement('div');
      card.className = 'promo-card';
      card.innerHTML = '<div class="promo-icon ' + iconCls + '">' + icon + '</div>' +
        '<div class="promo-info">' +
        '<div class="promo-name">' + escHtml(p.name) + '</div>' +
        '<div class="promo-type">' + escHtml(p.type) + '</div>' +
        '<div class="promo-rule">' + escHtml(ruleText) + '</div>' +
        '</div>';
      list.appendChild(card);
    });

    document.getElementById('promoSection').style.display = 'block';
    document.getElementById('btnClaim').disabled = false;
    document.getElementById('btnOrder').disabled = false;
    showToast('已加载 ' + approved.length + ' 个促销', 'success');
  } catch(e) {
    showToast('加载促销失败: ' + e.message, 'error');
    document.getElementById('btnClaim').disabled = false;
    document.getElementById('btnOrder').disabled = false;
    document.getElementById('promoSection').style.display = 'block';
  }
}

async function claimCoupon() {
  var aid = document.getElementById('activitySelect').value;
  if (!aid || !myPromoId) { showToast('请先选择活动', 'error'); return; }

  var btn = document.getElementById('btnClaim');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>领取中...';

  try {
    var res = await fetch(API + '/api/v1/coupons', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({promotion_id: myPromoId, user_id: 'customer_' + Date.now()})
    });
    var data = await res.json();
    showResult(res.status, data);

    if (data.code) {
      myCouponCode = data.code;
      document.getElementById('couponCode').textContent = data.code;
      document.getElementById('couponStatus').textContent = data.status === 'issued' ? '待使用' : data.status;
      document.getElementById('couponDisplay').classList.add('show');
      document.getElementById('btnUse').disabled = false;
      showToast('优惠券领取成功！', 'success');
    }
  } catch(e) {
    showToast('领取失败: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '领取欢迎券';
  }
}

function showOrderForm() {
  var form = document.getElementById('orderForm');
  form.classList.toggle('show');
  if (form.classList.contains('show')) {
    document.getElementById('orderAmount').focus();
  }
}

async function placeOrder() {
  var aid = document.getElementById('activitySelect').value;
  var amount = parseInt(document.getElementById('orderAmount').value) || 128;
  if (!aid) { showToast('请先选择活动', 'error'); return; }

  var btn = document.getElementById('btnOrder');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>下单中...';
  document.getElementById('orderForm').classList.remove('show');

  try {
    // Use simulate with 1 day to create orders
    var res = await fetch(API + '/api/v1/simulate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({activity_id: aid, days: 1, seed: Date.now()})
    });
    var data = await res.json();
    showResult(res.status, data.summary || data);
    showToast('下单成功！订单已生成', 'success');
  } catch(e) {
    showToast('下单失败: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '下单消费';
  }
}

async function useCoupon() {
  if (!myCouponCode) { showToast('请先领取优惠券', 'error'); return; }

  var btn = document.getElementById('btnUse');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>核销中...';

  try {
    var res = await fetch(API + '/api/v1/coupons/' + encodeURIComponent(myCouponCode) + '/use', {method:'POST'});
    var data = await res.json();
    showResult(res.status, data);

    if (data.status === 'used') {
      document.getElementById('couponStatus').textContent = '已使用';
      document.getElementById('couponDisplay').style.opacity = '0.5';
      document.getElementById('btnUse').disabled = true;
      showToast('核销成功！感谢光临 🍺', 'success');
    }
  } catch(e) {
    showToast('核销失败: ' + e.message, 'error');
    btn.disabled = false;
  } finally {
    btn.innerHTML = '核销优惠券';
  }
}

function showResult(status, data) {
  var panel = document.getElementById('resultPanel');
  document.getElementById('resultHttp').textContent = 'HTTP ' + status + '  ' + new Date().toLocaleTimeString();
  document.getElementById('resultJson').textContent = JSON.stringify(data, null, 2);
  panel.className = 'result-panel show' + (status >= 400 ? ' error' : '');
}

function showToast(msg, type) {
  var t = document.createElement('div');
  t.className = 'toast show ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 2500);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
</script>
</body>
</html>
